<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Gestão Kabide10</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: painel de loja em abas — Resumo, Pedidos, Lotes, Clientes, Despesas, Relatórios, Interessados, Ajustes — com cabeçalho fixo e botão flutuante */
:root{
  --bg:#0c0d0b; --panel:#151713; --panel-2:#1d201a; --line:#2c3027;
  --fg:#eef2e6; --muted:#9aa18f; --accent:#a6e600; --on-accent:#0c0d0b;
  --ok:#5fd38a; --warn:#f2b441; --bad:#ff6b5e; --info:#6fb7ff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5ee; --panel:#ffffff; --panel-2:#eaede3; --line:#d5dacb;
  --fg:#15180f; --muted:#5c6452; --accent:#4f7a00; --on-accent:#ffffff;
  --ok:#1d8a4a; --warn:#a86a00; --bad:#c7352a; --info:#1f6fc0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5ee; --panel:#ffffff; --panel-2:#eaede3; --line:#d5dacb;
  --fg:#15180f; --muted:#5c6452; --accent:#4f7a00; --on-accent:#ffffff;
  --ok:#1d8a4a; --warn:#a86a00; --bad:#c7352a; --info:#1f6fc0; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.02em;margin:0;line-height:1}
.brand h1 b{color:var(--accent)}
.brand span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--muted)}
section.view{display:grid;gap:18px;padding-top:18px}
h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mesnav{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:22px}
.mesnav span{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hi .val{color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--panel-2);border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.ok{border-left-color:var(--ok)} .alert.info{border-left-color:var(--info)}
.alert p{margin:0} .alert .grow{flex:1;min-width:0}
.list{display:grid;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.row .main{min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .r{text-align:right}
.row .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-aguardando{color:var(--warn)} .s-pago{color:var(--info)} .s-encomendado{color:var(--accent)} .s-recebido{color:var(--ok)} .s-entregue{color:var(--muted)} .s-cancelado{color:var(--bad)}
.s-aberto{color:var(--warn)} .s-comprou{color:var(--ok)} .s-desistiu{color:var(--bad)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.st{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 180px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:14px 20px;font:700 15px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.cur td{color:var(--accent);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.motivo{display:grid;gap:8px}
.tip{font-size:13px;color:var(--muted);margin:6px 0 0}
.tip b{color:var(--accent);font-weight:700}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:14px}}
.fld{display:grid;gap:4px}
.fld > label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;cursor:pointer}
.chip input{accent-color:var(--accent);margin:0}
.itens{display:grid;gap:10px;margin-bottom:8px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.item input,.item select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;min-width:0}
.item .chip{background:var(--panel);font-size:13px;padding:5px 9px;gap:5px}
.item .chips{gap:5px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.three{display:grid;grid-template-columns:1.3fr 1fr 70px;gap:8px}
.item-v{text-align:right;font-weight:600;font-size:14px;color:var(--muted)}
.calc{background:var(--panel-2);border-radius:8px;padding:10px 12px;display:grid;gap:2px;font-size:14px}
.calc div{display:flex;justify-content:space-between;gap:10px}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:90%}
.banner{background:var(--panel-2);border-left:4px solid var(--bad);padding:10px 12px;border-radius:8px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s}}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}
.login .box{max-width:400px;width:100%;display:grid;gap:14px;padding:24px}
.capa{background:#0c0d0b;border-radius:12px;padding:22px 18px;display:grid;place-items:center}
.capa img{width:100%;max-width:320px;height:auto;display:block}
.user{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;min-width:0}
.user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:12px}


.kpi .val.neg{color:var(--bad)}
.bar.big{height:12px;margin-top:8px}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar-l span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d a{color:var(--accent)}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.grp legend{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 6px}
.pag{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pag-novo{display:grid;gap:10px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.hist ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.hist summary{color:var(--muted)}
.big-txt{font-size:18px;margin:0}
.grid-socio{display:grid;grid-template-columns:1fr 110px;gap:10px}
.grid-aj{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ajustes{display:grid;gap:18px}
table.edit td{white-space:normal}
table.edit input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:90px}
.sticky-save{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:flex-end}
.sticky-save .btn{box-shadow:0 6px 20px rgba(0,0,0,.35);padding:12px 18px}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:180px;margin:6px 0 4px}
.chart .col{display:grid;grid-template-rows:1fr auto auto;height:100%;text-align:center;gap:2px;font-size:12px;min-width:0}
.chart .bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.chart .bars i{display:block;width:40%;max-width:22px;border-radius:4px 4px 0 0;min-height:1px}
.chart i.f,.legenda i.f{background:var(--accent)}
.chart i.l,.legenda i.l{background:var(--info)}
.chart b{font-weight:600;color:var(--muted)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:6px 0 10px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>KABIDE<b>10</b></h1><span>Gestão da loja</span><div class="user" id="user" hidden><span id="user-email"></span><button class="btn sm" id="sair">Sair</button></div></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-v="resumo" aria-selected="true">Resumo</button>
      <button role="tab" data-v="pedidos">Pedidos<span class="cnt" id="c-ped"></span></button>
      <button role="tab" data-v="lotes">Lotes<span class="cnt" id="c-lot"></span></button>
      <button role="tab" data-v="clientes">Clientes</button>
      <button role="tab" data-v="despesas">Despesas</button>
      <button role="tab" data-v="relatorios">Relatórios</button>
      <button role="tab" data-v="interessados">Interessados<span class="cnt" id="c-int"></span></button>
      <button role="tab" data-v="ajustes">Ajustes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="login" id="login">
    <div class="box">
      <div class="capa"><img src="logo.png" alt="Kabide10 — Paixão que se veste" width="720" height="420"></div>
      <h2>Entrar</h2>
      <p class="muted small" style="margin:0">Só as contas Google cadastradas da loja conseguem ver os pedidos.</p>
      <button class="btn pri" id="entrar">Entrar com Google</button>
      <p class="small" id="login-msg" style="margin:0;color:var(--bad)" hidden></p>
    </div>
  </section>
  <section class="view" id="v-resumo" hidden></section>
  <section class="view" id="v-pedidos" hidden></section>
  <section class="view" id="v-lotes" hidden></section>
  <section class="view" id="v-clientes" hidden></section>
  <section class="view" id="v-despesas" hidden></section>
  <section class="view" id="v-relatorios" hidden></section>
  <section class="view" id="v-interessados" hidden></section>
  <section class="view" id="v-ajustes" hidden></section>
</main>

<button class="fab" id="fab" hidden>+ Pedido</button>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCA0mhn4ive5Jo1Wnz5oEGGOjYzS3pgx8A",
  authDomain: "kabide10.firebaseapp.com",
  projectId: "kabide10",
  storageBucket: "kabide10.firebasestorage.app",
  messagingSenderId: "71709789099",
  appId: "1:71709789099:web:77ba4afcc5da6fa496a0ee"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== Configuração padrão (a loja edita na aba Ajustes; fica salva em config/loja) ===== */
const PADRAO = {
  tipos:{
    torcedor:{nome:"Torcedor", preco:179.99, custos:[109,99,89,79,69,65,59]},
    jogador:{nome:"Jogador", preco:209.99, custos:[139,129,119,109]},
    retro:{nome:"Retrô", preco:209.99, custos:[139,129,119,109]},
    infantil:{nome:"Kit Infantil", preco:199.99, custos:[129,119,109,99]}
  },
  extras:{
    personalizacao:{nome:"Nome e número", preco:24.99, custo:20},
    gola:{nome:"Gola polo", preco:14.99, custo:10},
    manga:{nome:"Manga longa", preco:34.99, custo:25},
    patrocinios:{nome:"Patrocínios", preco:49.99, custo:40},
    xg:{nome:"Tamanho XG", preco:15, custo:10}
  },
  prazo:{confeccao:7, uteis:20},
  diasAviso:5,
  meta:0,
  fidelidade:{camisas:5, premio:"Nome e número grátis"}
};
let CFG = JSON.parse(JSON.stringify(PADRAO));
let TIPOS = CFG.tipos, EXTRAS = CFG.extras;
function aplicarConfig(c){
  const base=JSON.parse(JSON.stringify(PADRAO));
  if(c){
    Object.keys(base.tipos).forEach(k=>{ if(c.tipos&&c.tipos[k]) Object.assign(base.tipos[k],c.tipos[k]); });
    Object.keys(base.extras).forEach(k=>{ if(c.extras&&c.extras[k]) Object.assign(base.extras[k],c.extras[k]); });
    ["prazo","fidelidade"].forEach(k=>{ if(c[k]) Object.assign(base[k],c[k]); });
    ["diasAviso","meta"].forEach(k=>{ if(typeof c[k]==="number") base[k]=c[k]; });
  }
  CFG=base; TIPOS=CFG.tipos; EXTRAS=CFG.extras;
}
const STATUS = [
  ["aguardando","Aguardando pagamento"],["pago","Pago"],["encomendado","Encomendado"],
  ["recebido","Chegou"],["entregue","Entregue"],["cancelado","Cancelado"]
];
const STATUS_NOME = Object.fromEntries(STATUS);
const MOTIVOS = {prazo:"Prazo de entrega", preco:"Preço", sumiu:"Parou de responder", modelo:"Não tinha o modelo/tamanho", outro:"Outro"};
const FORMAS = {pix:"Pix", cartao:"Cartão", dinheiro:"Dinheiro", outro:"Outro"};
const ENTREGAS = {retirada:"Retirada", local:"Entrega na cidade", envio:"Envio (Correios/transportadora)"};
const CAT_DESP = {embalagem:"Embalagem e adesivos",anuncio:"Impulsionamento / anúncio",frete:"Frete pro cliente",material:"Material e brindes",outro:"Outro"};
const TAMANHOS = ["P","M","G","GG","XG","Infantil"];

/* ===== util ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const r2 = v => Math.round((v||0)*100)/100;
const hoje = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtD = s => s ? parseD(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","") : "—";
const dBR = iso => iso ? parseD(iso).toLocaleDateString("pt-BR") : "";
const isoD = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const diasEntre = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const normNome = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim().toLowerCase();
const num = n => n ? "#"+String(n).padStart(4,"0") : "";
const mesAtual = () => hoje().slice(0,7);
function nomeDoMes(mes){ const [y,m]=mes.split("-").map(Number); const n=new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:y!==new Date().getFullYear()?"numeric":undefined}); return n[0].toUpperCase()+n.slice(1); }
function addUteis(d, n){ const x=new Date(d); while(n>0){ x.setDate(x.getDate()+1); const w=x.getDay(); if(w!==0&&w!==6) n--; } return x; }
function previsao(dataEnc){ if(!dataEnc) return null; const d=parseD(dataEnc); d.setDate(d.getDate()+(CFG.prazo.confeccao||0)); return isoD(addUteis(d,CFG.prazo.uteis||0)); }

/* ===== cálculo de preço, custo e pagamento ===== */
function custoUnit(tipo, qtd){ const c=(TIPOS[tipo]||TIPOS.torcedor).custos; return c[Math.min(Math.max(qtd,1),c.length)-1]; }
function precoPeca(it){ let v=TIPOS[it.tipo]?.preco||0; (it.extras||[]).forEach(e=>{ if(EXTRAS[e]) v+=EXTRAS[e].preco; }); return v; }
function custoExtras(it){ let v=0; (it.extras||[]).forEach(e=>{ if(EXTRAS[e]) v+=EXTRAS[e].custo; }); return v; }
/* um pedido tem uma lista de camisas; pedidos antigos, de uma camisa só, viram uma lista de 1 */
function itensDe(p){
  if(Array.isArray(p.itens)&&p.itens.length) return p.itens;
  return [{camisa:p.camisa||"",tipo:p.tipo||"torcedor",tamanho:p.tamanho||"",extras:p.extras||[],qtd:p.qtd||1,...(typeof p.custoUnit==="number"?{custoUnit:p.custoUnit}:{})}];
}
const pecasDe = p => itensDe(p).reduce((a,it)=>a+(it.qtd||1),0);
const precoItem = it => precoPeca(it)*(it.qtd||1);
const tabelaPedido = p => itensDe(p).reduce((a,it)=>a+precoItem(it),0);
/* valor: pedidos antigos guardavam o valor final; os novos guardam o desconto */
const valorPedido = p => typeof p.valor==="number" ? p.valor : Math.max(0, tabelaPedido(p)-(p.desconto||0));
const descontoDe = p => typeof p.valor==="number" ? Math.max(0,tabelaPedido(p)-p.valor) : Math.max(0,p.desconto||0);
/* custo: travado quando o lote fecha; antes disso, estimado como peça avulsa (pior caso) */
const custoItem = it => ((typeof it.custoUnit==="number"?it.custoUnit:custoUnit(it.tipo,1))+custoExtras(it))*(it.qtd||1);
const custoPedido = p => itensDe(p).reduce((a,it)=>a+custoItem(it),0);
const custoFixo = p => itensDe(p).every(it=>typeof it.custoUnit==="number");
function nomeItem(it){ const ex=(it.extras||[]).filter(e=>e!=="xg").map(e=>EXTRAS[e]?.nome).filter(Boolean).join(", "); return `${(it.qtd||1)>1?it.qtd+"× ":""}${it.camisa} · ${TIPOS[it.tipo]?.nome||""} ${it.tamanho||""}${ex?" · "+ex:""}`; }
const camisasTxt = p => itensDe(p).map(it=>it.camisa).filter(Boolean).join(", ");
const ativo = p => p.status!=="cancelado";
const pagoOuDepois = p => ["pago","encomendado","recebido","entregue"].includes(p.status);
/* pagamentos: pedidos antigos sem lista de pagamentos contam como pagos inteiros quando o status é pago ou depois */
function recebidoDe(p){ if(Array.isArray(p.pagamentos)) return p.pagamentos.reduce((a,x)=>a+(x.valor||0),0); return pagoOuDepois(p)?valorPedido(p):0; }
const faltaDe = p => p.status==="cancelado" ? 0 : Math.max(0, r2(valorPedido(p)-recebidoDe(p)));
const vendido = p => ativo(p) && (pagoOuDepois(p) || recebidoDe(p)>0);
function pagamentosDe(p){
  if(Array.isArray(p.pagamentos)) return p.pagamentos;
  return pagoOuDepois(p) ? [{valor:valorPedido(p),data:p.dataPedido,forma:"",antigo:true}] : [];
}

/* ===== estado e banco ===== */
const S = {pedidos:[], interessados:[], lotes:[], despesas:[], clientes:[], ready:{}, view:"resumo", filtro:"ativos", busca:"", buscaCli:"", mes:null};
let USER="";

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
function erroDb(e){
  const c=e&&e.code;
  if(c==="permission-denied") toast("Essa conta não tem permissão. Confira os e-mails nas regras do Firebase.");
  else if(c==="resource-exhausted") toast("Limite gratuito do Firebase atingido hoje. Tente amanhã.");
  else toast("Não deu pra salvar agora. Tente de novo em alguns segundos.");
}
let app, fs, auth, DB=null, unsubs=[];
app=initializeApp(firebaseConfig);
try{ fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
catch(_){ fs=initializeFirestore(app,{}); }
auth=getAuth(app);
async function salvar(col, id, data){ if(!DB){ toast("Sem conexão com o banco da loja."); return false; } try{ await setDoc(doc(fs,col,id),data); return true; }catch(e){ erroDb(e); return false; } }
async function atualizar(col, id, data){ if(!DB) return false; try{ await updateDoc(doc(fs,col,id),data); return true; }catch(e){ erroDb(e); return false; } }
async function apagar(col, id){ if(!DB) return false; try{ await deleteDoc(doc(fs,col,id)); return true; }catch(e){ erroDb(e); return false; } }
const novoId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* histórico: quem fez o quê em cada pedido (guarda os 40 últimos registros) */
const comHist = (p, acao) => [...((p&&p.historico)||[]), {t:Date.now(), quem:USER, acao}].slice(-40);
async function mudarPedido(p, ch, acao){ return atualizar("pedidos", p.id, {...ch, historico:comHist(p,acao)}); }
const proxNumero = () => S.pedidos.reduce((m,p)=>Math.max(m,p.numero||0),0)+1;

function mostrarApp(on){
  $("#login").hidden=on; $("#tabs").hidden=!on; $("#user").hidden=!on;
  document.querySelectorAll("section.view").forEach(s=>s.hidden = !on || s.id!=="v-"+S.view);
  ajustarFab();
}
function msgLogin(t){ const m=$("#login-msg"); m.textContent=t; m.hidden=!t; }

$("#entrar").addEventListener("click", async ()=>{
  msgLogin("");
  const prov=new GoogleAuthProvider();
  try{ await signInWithPopup(auth,prov); }
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth,prov);
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") msgLogin("Não deu pra entrar: "+e.code);
  }
});
$("#sair").addEventListener("click", ()=>signOut(auth));
onAuthStateChanged(auth, user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  if(!user){ DB=null; ["pedidos","interessados","lotes","despesas","clientes"].forEach(c=>S[c]=[]); mostrarApp(false); return; }
  USER=user.email; $("#user-email").textContent=user.email; DB=fs; mostrarApp(true); render();
  const falha = e => { if(e.code==="permission-denied"){ signOut(auth); msgLogin("A conta "+user.email+" não tem acesso à loja."); } else erroDb(e); };
  ["pedidos","interessados","lotes","despesas","clientes"].forEach(col=>{
    unsubs.push(onSnapshot(collection(fs,col), snap=>{
      S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      S.ready[col]=true; render();
    }, falha));
  });
  unsubs.push(onSnapshot(doc(fs,"config","loja"), snap=>{ aplicarConfig(snap.exists()?snap.data():null); S.ready.config=true; render(); }, falha));
});

/* ===== navegação ===== */
const VIEWS=["resumo","pedidos","lotes","clientes","despesas","relatorios","interessados","ajustes"];
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; irPara(b.dataset.v); });
function ajustarFab(){
  const v=S.view, f=$("#fab");
  f.textContent = v==="interessados" ? "+ Interessado" : v==="despesas" ? "+ Despesa" : "+ Pedido";
  f.hidden = !DB || ["clientes","relatorios","ajustes"].includes(v);
}
function irPara(v){
  S.view=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.hidden = !DB || s.id!=="v-"+v);
  ajustarFab(); window.scrollTo(0,0); render();
}
if(VIEWS.includes(location.hash.slice(1))) setTimeout(()=>irPara(location.hash.slice(1)),0);
$("#fab").addEventListener("click", ()=> S.view==="interessados" ? formInteressado() : S.view==="despesas" ? formDespesa() : formPedido());
const navMes = () => { if(!S.mes) S.mes=mesAtual(); return `<div class="mesnav"><button class="btn sm" data-mes="-1" aria-label="Mês anterior">‹</button><span>${nomeDoMes(S.mes)}</span><button class="btn sm" data-mes="1" aria-label="Próximo mês" ${S.mes===mesAtual()?"disabled":""}>›</button></div>`; };

/* ===== regras do dia a dia ===== */
function filaLote(){ return S.pedidos.filter(p=>!p.loteId && (p.status==="pago" || (p.status==="aguardando" && recebidoDe(p)>0))); }
function resumoLote(peds){
  const porTipo={};
  peds.forEach(p=>itensDe(p).forEach(it=>{ porTipo[it.tipo]=(porTipo[it.tipo]||0)+(it.qtd||1); }));
  let custo=0, receita=0;
  peds.forEach(p=>{ itensDe(p).forEach(it=>{ custo+=(custoUnit(it.tipo,porTipo[it.tipo])+custoExtras(it))*(it.qtd||1); }); receita+=valorPedido(p); });
  return {porTipo, custo, receita, lucro:receita-custo};
}
function precisaAviso(p){ if(p.status!=="encomendado") return false; const base=p.ultimoAviso||p.dataEncomenda; return !!base && diasEntre(base,hoje())>=(CFG.diasAviso||5); }
function atrasado(p){ if(p.status!=="encomendado") return false; const pv=previsao(p.dataEncomenda); return pv && pv<hoje(); }

/* ===== render ===== */
function render(){
  $("#c-ped").textContent = S.pedidos.filter(p=>!["entregue","cancelado"].includes(p.status)).length||"";
  $("#c-lot").textContent = filaLote().length||"";
  $("#c-int").textContent = S.interessados.filter(i=>i.situacao==="aberto").length||"";
  ({resumo:rResumo,pedidos:rPedidos,lotes:rLotes,clientes:rClientes,despesas:rDespesas,relatorios:rRelatorios,interessados:rInteressados,ajustes:rAjustes})[S.view]();
}

/* ----- Resumo ----- */
function rResumo(){
  const head=navMes(), mes=S.mes;
  const doMes=S.pedidos.filter(p=>vendido(p)&&(p.dataPedido||"").startsWith(mes));
  const todos=S.pedidos.filter(vendido);
  const fat=doMes.reduce((a,p)=>a+valorPedido(p),0), luc=doMes.reduce((a,p)=>a+valorPedido(p)-custoPedido(p),0);
  const despMes=S.despesas.filter(d=>(d.data||"").startsWith(mes)).reduce((a,d)=>a+(d.valor||0),0);
  const despTot=S.despesas.reduce((a,d)=>a+(d.valor||0),0);
  const fatTot=todos.reduce((a,p)=>a+valorPedido(p),0), lucTot=todos.reduce((a,p)=>a+valorPedido(p)-custoPedido(p),0);
  const real=luc-despMes;
  const aReceber=S.pedidos.filter(ativo).filter(p=>faltaDe(p)>0);
  const and=S.pedidos.filter(p=>["pago","encomendado","recebido"].includes(p.status));
  const ints=S.interessados.filter(i=>i.situacao!=="aberto");
  const conv=ints.length? Math.round(100*ints.filter(i=>i.situacao==="comprou").length/ints.length):null;
  const meta=CFG.meta||0, pctMeta=meta?Math.min(100,Math.round(100*fat/meta)):0;

  const al=[];
  S.pedidos.filter(atrasado).forEach(p=>al.push(`<div class="alert bad"><div class="grow"><p><b>${num(p.numero)} ${esc(p.cliente)}</b> passou da previsão (${fmtD(previsao(p.dataEncomenda))}). Cobre o fornecedor e avise o cliente.</p></div><button class="btn sm" data-ed="${p.id}">Abrir</button></div>`));
  S.pedidos.filter(p=>precisaAviso(p)&&!atrasado(p)).forEach(p=>al.push(`<div class="alert"><div class="grow"><p>Mande notícia pra <b>${esc(p.cliente)}</b>: faz ${diasEntre(p.ultimoAviso||p.dataEncomenda,hoje())} dias sem atualização.</p></div><button class="btn sm" data-msg="${p.id}">Copiar mensagem</button><button class="btn sm" data-avisei="${p.id}">Avisei</button></div>`));
  const fila=filaLote();
  if(fila.length){ const r=resumoLote(fila); al.push(`<div class="alert info"><div class="grow"><p><b>${fila.length} pedido${fila.length>1?"s":""}</b> esperando encomenda. Lucro previsto do lote: <b class="num">${brl(r.lucro)}</b>.</p></div><button class="btn sm" data-go="lotes">Ver lote</button></div>`); }
  S.pedidos.filter(p=>p.status==="recebido").forEach(p=>al.push(`<div class="alert ok"><div class="grow"><p>A camisa de <b>${esc(p.cliente)}</b> chegou.${faltaDe(p)>0?` Falta receber <b class="num">${brl(faltaDe(p))}</b>.`:""} Combine a entrega${p.entrega&&p.entrega.tipo?" ("+ENTREGAS[p.entrega.tipo]+")":""}.</p></div><button class="btn sm" data-ed="${p.id}">Abrir</button></div>`));
  const semNum=S.pedidos.filter(p=>!p.numero).length;
  if(semNum) al.push(`<div class="alert info"><div class="grow"><p>${semNum} pedido${semNum>1?"s":""} sem número. Dá pra numerar todos de uma vez em Ajustes.</p></div><button class="btn sm" data-go="ajustes">Ajustes</button></div>`);

  $("#v-resumo").innerHTML = `${head}
    ${meta?`<div class="box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3 style="margin:0">Meta do mês</h3><span class="num">${brl(fat)} de ${brl(meta)}</span></div><div class="bar big"><i style="width:${pctMeta}%"></i></div><p class="tip">${fat>=meta?"<b>Meta batida!</b>":"Faltam <b>"+brl(meta-fat)+"</b> ("+pctMeta+"% feito)."}</p></div>`:""}
    <div class="kpis">
      <div class="kpi hi"><div class="lab">Faturamento</div><div class="val">${brl(fat)}</div><div class="sub">${doMes.length} pedido${doMes.length===1?"":"s"} · ${doMes.reduce((a,p)=>a+pecasDe(p),0)} camisas</div></div>
      <div class="kpi"><div class="lab">Lucro real</div><div class="val ${real<0?"neg":""}">${brl(real)}</div><div class="sub">bruto ${brl(luc)} − despesas ${brl(despMes)}</div></div>
      <div class="kpi"><div class="lab">A receber</div><div class="val">${brl(aReceber.reduce((a,p)=>a+faltaDe(p),0))}</div><div class="sub">${aReceber.length} pedido${aReceber.length===1?"":"s"} com valor em aberto</div></div>
      <div class="kpi"><div class="lab">Em andamento</div><div class="val">${and.length}</div><div class="sub">pagos, encomendados ou já chegaram</div></div>
      <div class="kpi"><div class="lab">Desde o início</div><div class="val">${brl(fatTot)}</div><div class="sub">lucro real ${brl(lucTot-despTot)} · ${todos.length} pedido${todos.length===1?"":"s"}</div></div>
    </div>
    <div class="box"><h3>O que fazer agora</h3>
      ${!S.ready.pedidos?`<p class="muted">Carregando dados da loja…</p>`: al.length?`<div class="alerts">${al.join("")}</div>`:`<div class="empty"><strong>Nada pendente.</strong>Quando um cliente precisar de notícia, um lote estiver pronto ou uma camisa chegar, aparece aqui.</div>`}
    </div>
    <div class="box"><h3>Por que as pessoas desistem?</h3>
      ${ints.length<5?`<p class="muted small" style="margin:0">Registre cada pessoa que pergunta de camisa na aba Interessados. Com pelo menos 5 respostas fechadas, aqui aparece se o problema é mesmo o prazo. Hoje: ${ints.length} de 5.</p>`:`<p style="margin:0 0 8px"><span class="num" style="font-size:20px;font-weight:600">${conv}%</span> <span class="muted">dos interessados compraram.</span></p>${blocoMotivos()}`}
    </div>`;
}
function blocoMotivos(){
  const des=S.interessados.filter(i=>i.situacao==="desistiu");
  if(!des.length) return `<p class="muted small">Ninguém desistiu ainda.</p>`;
  const cnt={}; des.forEach(i=>{ cnt[i.motivo||"outro"]=(cnt[i.motivo||"outro"]||0)+1; });
  return barras(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([m,n])=>[MOTIVOS[m]||m,n,`${n} · ${Math.round(100*n/des.length)}%`]));
}
/* barras horizontais simples: [rótulo, valor, texto] */
function barras(rows){ const max=Math.max(1,...rows.map(r=>r[1])); return `<div class="motivo">${rows.map(([l,v,t])=>`<div><div class="bar-l"><span>${esc(l)}</span><span class="num">${t??v}</span></div><div class="bar"><i style="width:${100*v/max}%"></i></div></div>`).join("")}</div>`; }

/* ----- Pedidos ----- */
function linhaPedido(p){
  const v=valorPedido(p), c=custoPedido(p), n=pecasDe(p), falta=faltaDe(p), rec=recebidoDe(p);
  const pv = p.status==="encomendado" ? ` · chega até ${fmtD(previsao(p.dataEncomenda))}` : "";
  const ent = p.entrega&&p.entrega.tipo ? ` · ${ENTREGAS[p.entrega.tipo]}${p.entrega.data?" "+fmtD(p.entrega.data):""}` : "";
  return `<div class="row">
    <div class="main"><div class="t"><span class="muted num">${num(p.numero)}</span> ${esc(p.cliente)}</div>
      ${itensDe(p).map(it=>`<div class="d">${esc(nomeItem(it))}${it.foto?` · <a href="${esc(it.foto)}" target="_blank" rel="noopener">foto</a>`:""}</div>`).join("")}
      <div class="d">${n>1?n+" camisas · ":""}Pedido em ${fmtD(p.dataPedido)}${pv}${ent}</div>
      ${ativo(p)&&falta>0&&rec>0?`<div class="d"><span class="pill s-aguardando">Sinal ${brl(rec)} · falta ${brl(falta)}</span></div>`:ativo(p)&&falta>0&&p.status!=="aguardando"?`<div class="d"><span class="pill s-aguardando">Falta receber ${brl(falta)}</span></div>`:""}</div>
    <div class="r"><div class="num" style="font-weight:600">${brl(v)}</div><div class="d num">lucro ${brl(v-c)}${custoFixo(p)?"":"*"}</div></div>
    <div class="acts">
      <select class="st s-${p.status}" data-st="${p.id}" aria-label="Status de ${esc(p.cliente)}">${STATUS.map(([k,n])=>`<option value="${k}" ${k===p.status?"selected":""}>${n}</option>`).join("")}</select>
      ${falta>0&&ativo(p)?`<button class="btn sm" data-pagar="${p.id}">Registrar pagamento</button>`:""}
      ${p.status==="encomendado"?`<button class="btn sm" data-msg="${p.id}">Copiar mensagem</button>`:""}
      <button class="btn sm" data-ed="${p.id}">Abrir</button>
    </div></div>`;
}
function rPedidos(){
  const f=S.filtro, q=normNome(S.busca);
  let l=S.pedidos.slice().sort((a,b)=>(b.numero||0)-(a.numero||0)||(b.dataPedido||"").localeCompare(a.dataPedido||"")||(b.criado||0)-(a.criado||0));
  if(f==="ativos") l=l.filter(p=>!["entregue","cancelado"].includes(p.status));
  else if(f==="receber") l=l.filter(p=>faltaDe(p)>0);
  else if(f!=="todos") l=l.filter(p=>p.status===f);
  if(q) l=l.filter(p=>normNome(num(p.numero)+" "+p.numero+" "+p.cliente+" "+camisasTxt(p)+" "+(p.contato||"")).includes(q));
  const foco=document.activeElement&&document.activeElement.id==="busca";
  $("#v-pedidos").innerHTML = `
    <div class="toolbar">
      <input id="busca" type="search" placeholder="Buscar nº, cliente ou camisa" value="${esc(S.busca)}" aria-label="Buscar pedidos">
      <select id="filtro" aria-label="Filtrar pedidos">
        <option value="ativos" ${f==="ativos"?"selected":""}>Em aberto</option>
        <option value="receber" ${f==="receber"?"selected":""}>Com valor a receber</option>
        <option value="todos" ${f==="todos"?"selected":""}>Todos</option>
        ${STATUS.map(([k,n])=>`<option value="${k}" ${f===k?"selected":""}>${n}</option>`).join("")}
      </select>
    </div>
    ${!S.pedidos.length?`<div class="empty"><strong>Nenhum pedido ainda.</strong>Toque em “+ Pedido” pra registrar a primeira venda. O preço sai sozinho pela tabela da loja.</div>`:
      l.length?`<div class="list">${l.map(linhaPedido).join("")}</div><p class="tip">* lucro estimado com custo de peça avulsa; fica exato quando o lote é encomendado.</p>`:`<div class="empty">Nenhum pedido com esse filtro.</div>`}`;
  if(foco){ const i=$("#busca"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
}

/* ----- Lotes ----- */
function rLotes(){
  const fila=filaLote(), r=resumoLote(fila);
  const dicas=Object.entries(r.porTipo).map(([t,n])=>{
    const cs=TIPOS[t].custos;
    if(n>=cs.length) return `<p class="tip">${TIPOS[t].nome}: ${n} peças, já no menor custo (<b>${brl(cs[cs.length-1])}</b> cada).</p>`;
    const agora=custoUnit(t,n), dep=custoUnit(t,n+1), econ=n*(agora-dep);
    return `<p class="tip">${TIPOS[t].nome}: ${n} peça${n>1?"s":""} a ${brl(agora)}. Com <b>+1 camisa</b> o custo cai pra <b>${brl(dep)}</b> e você economiza ${brl(econ)} nas que já tem.</p>`;
  }).join("");
  const lotes=S.lotes.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  $("#v-lotes").innerHTML = `
    <div class="box"><h2>Próximo lote</h2>
      <p class="muted small" style="margin:4px 0 12px">Pedidos pagos (ou com sinal) que ainda não foram encomendados. Quanto mais peças do mesmo tipo, menor o custo de cada uma.</p>
      ${fila.length?`

async function fecharLote(btn){

/* ----- Clientes e fidelidade ----- */
function listaClientes(){
  const m=new Map();
  S.pedidos.filter(ativo).forEach(p=>{ const k=normNome(p.cliente); if(!k) return; if(!m.has(k)) m.set(k,{chave:k,peds:[]}); m.get(k).peds.push(p); });
  return [...m.values()].map(c=>{
    c.peds.sort((a,b)=>(b.dataPedido||"").localeCompare(a.dataPedido||""));
    const pagos=c.peds.filter(vendido);
    c.nome=c.peds.map(p=>String(p.cliente).replace(/\s+/g," ").trim()).sort((x,y)=>(y.match(/[A-ZÀ-Ý]/g)||[]).length-(x.match(/[A-ZÀ-Ý]/g)||[]).length)[0];
    c.contato=(c.peds.find(p=>p.contato)||{}).contato||"";
    c.total=pagos.reduce((a,p)=>a+valorPedido(p),0);
    c.camisas=pagos.reduce((a,p)=>a+pecasDe(p),0);
    c.ultima=c.peds[0].dataPedido; c.n=c.peds.length;
    const reg=S.clientes.find(x=>x.id===docCliente(c.chave)) || {};
    const meta=CFG.fidelidade.camisas||0;
    c.premios = meta ? Math.floor(c.camisas/meta) : 0;
    c.usados = reg.premiosUsados||0;
    c.faltam = meta ? meta - (c.camisas % meta) : 0;
    return c;
  }).sort((a,b)=>b.total-a.total||b.n-a.n);
}
const docCliente = k => k.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,120)||"sem-nome";
function rClientes(){
  const foco=document.activeElement&&document.activeElement.id==="busca-cli";

  const voltaram=todos.filter(c=>c.n>=2).length, meta=CFG.fidelidade.camisas||0;
  const comPremio=todos.filter(c=>c.premios>c.usados);
  $("#v-clientes").innerHTML=`

      <div class="kpi hi"><div class="lab">Voltaram a comprar</div><div class="val">${voltaram}</div><div class="sub">${todos.length?Math.round(100*voltaram/todos.length)+"% dos clientes":"—"}</div></div>
      ${meta?`<div class="kpi"><div class="lab">Prêmios pra entregar</div><div class="val">${comPremio.reduce((a,c)=>a+c.premios-c.usados,0)}</div><div class="sub">a cada ${meta} camisas: ${esc(CFG.fidelidade.premio)}</div></div>`:""}
    </div>

    ${!todos.length?`<div class="empty"><strong>Nenhum cliente ainda.</strong>A lista monta sozinha a partir dos pedidos registrados.</div>`:
      l.length?`<div class="list">${l.map(c=>{

        return `<div class="row">

async function salvarAjustes(e){
  e.preventDefault();
  const n=id=>parseFloat($(id).value), c={tipos:{},extras:{}};
  for(const k of Object.keys(TIPOS)){
    const custos=$("#a-tc-"+k).value.split(/[,;\s]+/).map(x=>parseFloat(x.replace(",","."))).filter(x=>x>0);
    if(!custos.length||!(n("#a-tp-"+k)>0)){ toast("Confira o preço e os custos de "+TIPOS[k].nome+"."); return; }
    c.tipos[k]={preco:r2(n("#a-tp-"+k)),custos};
  }
  for(const k of Object.keys(EXTRAS)) c.extras[k]={preco:r2(n("#a-ep-"+k)||0),custo:r2(n("#a-ec-"+k)||0)};
  c.prazo={confeccao:Math.max(0,Math.round(n("#a-conf")||0)),uteis:Math.max(0,Math.round(n("#a-uteis")||0))};
  c.diasAviso=Math.max(1,Math.round(n("#a-aviso")||5));
  c.meta=Math.max(0,n("#a-meta")||0);
  c.fidelidade={camisas:Math.max(0,Math.round(n("#a-fid")||0)),premio:$("#a-prem").value.trim()||"Prêmio"};
  c.atualizadoPor=USER; c.atualizadoEm=Date.now();
  document.activeElement&&document.activeElement.blur();
  if(await salvar("config","loja",c)) toast("Ajustes salvos");
}
async function numerarAntigos(btn){
  btn.disabled=true;
  let n=proxNumero();
  const sem=S.pedidos.filter(p=>!p.numero).sort((a,b)=>(a.dataPedido||"").localeCompare(b.dataPedido||"")||(a.criado||0)-(b.criado||0));
  for(const p of sem){ await mudarPedido(p,{numero:n},"Recebeu o número "+num(n)); n++; }
  toast(sem.length+" pedido"+(sem.length>1?"s":"")+" numerado"+(sem.length>1?"s":""));
}

  if(d.edi) formInteressado(S.interessados.find(i=>i.id===d.edi));

  if(d.msg) copiarMsg(S.pedidos.find(p=>p.id===d.msg));
  if(d.virou){ const i=S.interessados.find(x=>x.id===d.virou); formPedido(null,{cliente:i.nome,contato:i.contato||"",camisa:i.camisa||"",deInteressado:i.id}); }
  if(d.desist) formInteressado(S.interessados.find(i=>i.id===d.desist),"desistiu");
  if(d.chegou){ const peds=S.pedidos.filter(p=>p.loteId===d.chegou&&p.status==="encomendado"); for(const p of peds){ await mudarPedido(p,{status:"recebido",dataChegada:hoje()},"Chegou"); } toast(peds.length+" pedido(s) marcados como chegou"); }
  if(d.premio){ const k=docCliente(d.premio), reg={...(S.clientes.find(x=>x.id===k)||{})}; delete reg.id; if(await salvar("clientes",k,{...reg,chave:d.premio,premiosUsados:(reg.premiosUsados||0)+1,ultimoPremio:hoje(),por:USER})) toast("Prêmio marcado como entregue"); }
  if(b.id==="backup") baixarBackup(b);
  if(b.id==="numerar") numerarAntigos(b);
  if(b.id==="fechar"){ $("#fechar-area").innerHTML=`<p class="small" style="margin:0 0 8px">Confirma que você fez a encomenda desses pedidos no fornecedor hoje? Os custos ficam travados com o valor do lote.</p><div class="toolbar"><button class="btn pri" id="fechar-ok">Sim, encomendei</button><button class="btn" id="fechar-no">Cancelar</button></div>`; }
  if(b.id==="fechar-no") rLotes();
  if(b.id==="fechar-ok") fecharLote(b);
});

async function copiarMsg(p){
  if(!p) return;
  const pv=previsao(p.dataEncomenda), muitas=pecasDe(p)>1;
  const txt=`Oi, ${p.cliente.split(" ")[0]}! Aqui é da Kabide10. ${muitas?"Suas camisas ("+camisasTxt(p)+") já foram encomendadas e estão":"Sua camisa "+camisasTxt(p)+" já foi encomendada e está"} em produção. A previsão é chegar até ${pv?parseD(pv).toLocaleDateString("pt-BR"):"o fim do prazo"}.${faltaDe(p)>0?" Fica faltando "+brl(faltaDe(p))+" pra pagar na entrega.":""} Assim que chegar eu te aviso pra combinarmos a entrega!`;
  try{ await navigator.clipboard.writeText(txt); toast("Mensagem copiada. Cole no WhatsApp do cliente."); }
  catch(_){ abrirModal(`<h2>Mensagem pro cliente</h2><div class="fld"><label for="msgtxt">Selecione e copie</label><textarea id="msgtxt" rows="6">${esc(txt)}</textarea></div><div class="sheet-acts"><span></span><button class="btn" data-close>Fechar</button></div>`); const ta=$("#msgtxt"); ta.focus(); ta.select(); }
}

const linhaPag = (x,i) => `<div class="pag"><div><b class="num">${brl(x.valor)}</b> <span class="muted small">${dBR(x.data)}${x.forma?" · "+(FORMAS[x.forma]||x.forma):""}${x.antigo?" · registrado antes dos pagamentos":""}</span></div>${x.antigo?"":`<button type="button" class="btn sm danger" data-rmpag="${i}">Remover</button>`}</div>`;

/* registrar pagamento rápido, direto da lista */
function formPagamento(p){
  if(!p) return;
  const falta=faltaDe(p);
  abrirModal(`<h2>Pagamento ${num(p.numero)}</h2>
    <p class="muted" style="margin:0">${esc(p.cliente)} · total ${brl(valorPedido(p))} · já pagou ${brl(recebidoDe(p))} · <b>falta ${brl(falta)}</b></p>
    <form id="fpg" class="sheet" style="padding:0;max-height:none;background:none">
      ${camposPagamento("pg",falta)}
      <div class="toolbar"><button type="button" class="btn sm" id="pg-tudo">Pagou tudo (${brl(falta)})</button></div>
      <div class="sheet-acts"><span></span><span class="toolbar"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Registrar</button></span></div>
    </form>`);
  $("#pg-tudo").addEventListener("click",()=>{ $("#pg-v").value=falta.toFixed(2); });
  $("#fpg").addEventListener("submit",async e=>{
    e.preventDefault(); const x=lerPagamento("pg"); if(!x){ toast("Coloque o valor recebido."); return; }
    const pags=[...pagamentosDe(p).map(y=>{ const z={...y}; delete z.antigo; return z; }), x];
    const ch={pagamentos:pags};
    const rec=pags.reduce((a,y)=>a+y.valor,0);
    if(p.status==="aguardando"&&rec>=valorPedido(p)-0.009) ch.status="pago";
    if(await mudarPedido(p,ch,"Pagamento de "+brl(x.valor)+(ch.status?" (quitado)":""))){ fecharModal(); toast(ch.status?"Pedido quitado e marcado como pago":"Pagamento registrado"); }
  });
  $("#pg-v").focus();
}

      </fieldset>
      <fieldset class="grp"><legend>Entrega</legend>
        <div class="two"><div class="fld"><label for="f-etipo">Como</label><select id="f-etipo"><option value="">A combinar</option>${Object.entries(ENTREGAS).map(([k,n])=>`<option value="${k}" ${ent.tipo===k?"selected":""}>${n}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-edata">Data combinada</label><input id="f-edata" type="date" value="${ent.data||""}"></div></div>
        <div class="fld"><label for="f-eend">Endereço ou local</label><input id="f-eend" value="${esc(ent.endereco)}" placeholder="Rua, número, bairro / ponto de encontro"></div>
        <div class="fld" id="f-erastro-w" ${ent.tipo==="envio"?"":"hidden"}><label for="f-erastro">Código de rastreio</label><input id="f-erastro" value="${esc(ent.rastreio)}"></div>
      </fieldset>
      <div class="two">
        <div class="fld"><label for="f-data">Data do pedido</label><input id="f-data" type="date" value="${p.dataPedido||hoje()}"></div>
        <div class="fld"><label for="f-status">Status</label><select id="f-status">${STATUS.map(([k,n])=>`<option value="${k}" ${k===p.status?"selected":""}>${n}</option>`).join("")}</select></div>
      </div>
      <div class="fld"><label for="f-obs">Observações</label><textarea id="f-obs" rows="2" placeholder="Nome e número de cada camisa, combinados com o cliente…">${esc(p.obs)}</textarea></div>
      ${ed&&(p.historico||[]).length?`<details class="hist"><summary>Histórico (${p.historico.length})</summary><ul>${p.historico.slice().reverse().map(h=>`<li><span class="num">${new Date(h.t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span> ${esc(h.acao)} <span class="muted">· ${esc((h.quem||"").split("@")[0])}</span></li>`).join("")}</ul></details>`:""}
      <div class="sheet-acts">

  const lerItens=()=>{ document.querySelectorAll("#f-itens .item").forEach((el,i)=>{ const it=itens[i]; if(!it) return;
      it.camisa=el.querySelector('[data-k="camisa"]').value.trim(); it.tipo=el.querySelector('[data-k="tipo"]').value;
      it.tamanho=el.querySelector('[data-k="tamanho"]').value; it.qtd=Math.max(1,parseInt(el.querySelector('[data-k="qtd"]').value)||1);

      <input data-k="camisa" aria-label="Camisa ${i+1}" placeholder="Ex.: Flamengo I 2026" value="${esc(it.camisa)}">
      <div class="three">
        <select data-k="tipo" aria-label="Versão da camisa ${i+1}">${Object.entries(TIPOS).map(([k,T])=>`<option value="${k}" ${k===it.tipo?"selected":""}>${T.nome}</option>`).join("")}</select>
        <select data-k="tamanho" aria-label="Tamanho da camisa ${i+1}">${TAMANHOS.map(t=>`<option ${t===it.tamanho?"selected":""}>${t}</option>`).join("")}</select>
        <input data-k="qtd" type="number" min="1" max="50" value="${it.qtd||1}" aria-label="Quantidade da camisa ${i+1}">
      </div>
      <div class="chips">${Object.entries(EXTRAS).map(([k,E])=>`<label class="chip"><input type="checkbox" data-x="${k}" ${(it.extras||[]).includes(k)?"checked":""}>${E.nome} <span class="muted num">+${brl(E.preco)}</span></label>`).join("")}</div>
      <input data-k="foto" type="url" aria-label="Link da foto da camisa ${i+1}" placeholder="Link da foto (Google Fotos, Drive…) — opcional" value="${esc(it.foto)}">
      <div class="item-v num">${brl(precoItem(it))}</div>
    </div>`).join("");
  };
  const desenharPags=()=>{ $("#f-pags").innerHTML = pags.length ? pags.map(linhaPag).join("") : `<p class="muted small" style="margin:0">Nenhum pagamento registrado.</p>`; };
  const desenharJuntar=()=>{ const outros=mesmoCliente();

  const lerPagamentoSeAberto=()=>{ const v=parseFloat($("#np-v").value); return v>0?lerPagamento("np"):null; };
  const calc=()=>{ lerItens(); document.querySelectorAll("#f-itens .item-v").forEach((el,i)=>el.textContent=brl(precoItem(itens[i])));
    const t=totais(), c=itens.reduce((a,it)=>a+custoItem(it),0), n=itens.reduce((a,it)=>a+it.qtd,0);
    $("#f-calc").innerHTML=`<div><span>${n} camisa${n>1?"s":""} pela tabela</span><span class="num">${brl(t.tab)}</span></div>${t.ds>0.004?`<div><span>Desconto (${Math.round(100*t.ds/(t.tab||1))}%)</span><span class="num">− ${brl(t.ds)}</span></div>`:t.ds<-0.004?`<div><span>Acréscimo</span><span class="num">+ ${brl(-t.ds)}</span></div>`:""}<div><b>Total do pedido</b><b class="num">${brl(t.val)}</b></div><div><span>Custo ${itens.every(it=>typeof it.custoUnit==="number")?"do lote":"se for avulso"}</span><span class="num">${brl(c)}</span></div><div><span>Lucro</span><span class="num">${brl(t.val-c)}</span></div><div><span>Pago</span><span class="num">${brl(t.rec)}</span></div><div><b>Falta receber</b><b class="num">${brl(Math.max(0,t.val-t.rec))}</b></div>`; };
  desenharItens(); desenharPags(); desenharJuntar(); calc();

  $("#fp").addEventListener("change",e=>{ const el=e.target;
    if(el.dataset.k==="tipo"&&el.value==="infantil"){ el.closest(".item").querySelector('[data-k="tamanho"]').value="Infantil"; }
    if(el.dataset.k==="tamanho"){ el.closest(".item").querySelector('[data-x="xg"]').checked = el.value==="XG"; }
    if(el.id==="f-cliente") desenharJuntar();
    if(el.id==="f-etipo") $("#f-erastro-w").hidden = el.value!=="envio";
    calc(); });
  $("#fp").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    if(b.id==="f-add"){ lerItens(); const ult=itens[itens.length-1]; itens.push({camisa:"",tipo:ult?ult.tipo:"torcedor",tamanho:ult?ult.tamanho:"G",extras:[],qtd:1}); desenharItens(); calc(); const ins=document.querySelectorAll('#f-itens [data-k="camisa"]'); ins[ins.length-1].focus(); }
    if(b.dataset.rm){ lerItens(); itens.splice(Number(b.dataset.rm),1); desenharItens(); calc(); }
    if(b.dataset.rmpag){ pags.splice(Number(b.dataset.rmpag),1); desenharPags(); calc(); }
    if(b.id==="f-juntar-btn"){ lerItens(); mesmoCliente().forEach(o=>{ itensDe(o).forEach(it=>itens.push({...it,extras:[...(it.extras||[])]})); pagamentosDe(o).forEach(x=>pags.push({...x})); if($("#f-venda").value!==""||descontoDe(o)>0){ const atual=$("#f-venda").value===""?itens.slice(0,itens.length-itensDe(o).length).reduce((a,it)=>a+precoItem(it),0):parseFloat($("#f-venda").value)||0; $("#f-venda").value=r2(atual+valorPedido(o)); } juntar.push(o.id); }); desenharItens(); desenharPags(); desenharJuntar(); calc(); toast("Camisas juntadas. Confira e salve."); }
  });
  if(ed) $("#f-del").addEventListener("click",()=>{ $("#del-area").innerHTML=`<button type="button" class="btn danger" id="f-del2">Confirmar exclusão</button>`; $("#f-del2").addEventListener("click",async()=>{ if(await apagar("pedidos",p.id)){ fecharModal(); toast("Pedido excluído"); } }); });
  $("#fp").addEventListener("submit",async e=>{
    e.preventDefault(); lerItens();
    const cliente=$("#f-cliente").value.trim();
    if(!cliente){ toast("Preencha o nome do cliente."); return; }
    if(itens.some(it=>!it.camisa)){ toast("Preencha o nome de todas as camisas."); return; }
    const novo=lerPagamentoSeAberto(); if(novo) pags.push(novo);
    const t=totais();
    const data={...(ed?p:{}),cliente,contato:$("#f-contato").value.trim(),
      itens:itens.map(it=>{ const o={camisa:it.camisa,tipo:it.tipo,tamanho:it.tamanho,extras:it.extras,qtd:it.qtd}; if(it.foto) o.foto=it.foto; if(typeof it.custoUnit==="number") o.custoUnit=it.custoUnit; return o; }),
      desconto:r2(t.ds), motivoDesconto:$("#f-mdesc").value.trim(),
      pagamentos:pags.map(x=>{ return {valor:r2(x.valor),data:x.data||hoje(),forma:x.forma||""}; }),
      entrega:{tipo:$("#f-etipo").value,data:$("#f-edata").value,endereco:$("#f-eend").value.trim(),rastreio:$("#f-erastro").value.trim()},
      dataPedido:$("#f-data").value||hoje(),status:$("#f-status").value,obs:$("#f-obs").value.trim()};
    ["id","deInteressado","camisa","tipo","tamanho","extras","qtd","custoUnit","valor","vendedor"].forEach(k=>delete data[k]);
    const rec=data.pagamentos.reduce((a,x)=>a+x.valor,0);
    if(data.status==="aguardando"&&rec>0&&rec>=Math.max(0,t.tab-t.ds)-0.009) data.status="pago";
    if(!ed){ data.criado=Date.now(); data.numero=proxNumero(); }
    else if(!data.numero) data.numero=proxNumero();
    if(data.status==="encomendado"&&!data.dataEncomenda) data.dataEncomenda=hoje();
    if(data.status==="recebido"&&!data.dataChegada) data.dataChegada=hoje();
    const acoes=[]; if(!ed) acoes.push("Pedido criado"); else acoes.push("Pedido editado");
    if(ed&&p.status!==data.status) acoes.push("status: "+STATUS_NOME[data.status]);
    if(novo) acoes.push("pagamento de "+brl(novo.valor));
    if(juntar.length) acoes.push("juntou "+juntar.length+" pedido(s)");
    data.historico=comHist(ed?p:null,acoes.join(", "));
    const id=ed?p.id:novoId();
    if(await salvar("pedidos",id,data)){
      for(const oid of juntar) await apagar("pedidos",oid);
      if(pre&&pre.deInteressado) await atualizar("interessados",pre.deInteressado,{situacao:"comprou",pedidoId:id});
      fecharModal(); toast(ed?"Pedido salvo":`Pedido ${num(data.numero)} registrado`);
    }
  });
  if(!ed) $("#f-cliente").focus();
}

function formDespesa(d){
  const ed=!!d; d=d||{data:hoje(),categoria:"embalagem"};
  abrirModal(`<h2>${ed?"Editar despesa":"Nova despesa"}</h2>
    <form id="fd" class="sheet" style="padding:0;max-height:none;background:none">
      <div class="fld"><label for="d-desc">O que foi</label><input id="d-desc" value="${esc(d.descricao)}" placeholder="Ex.: 50 sacolas + adesivos"></div>
      <div class="two">
        <div class="fld"><label for="d-valor">Valor (R$)</label><input id="d-valor" type="number" step="0.01" min="0" required value="${d.valor??""}"></div>
        <div class="fld"><label for="d-data">Data</label><input id="d-data" type="date" value="${d.data||hoje()}"></div>
      </div>
      <div class="fld"><label for="d-cat">Categoria</label><select id="d-cat">${Object.entries(CAT_DESP).map(([k,n])=>`<option value="${k}" ${k===d.categoria?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="sheet-acts">
        ${ed?`<span id="deld-area"><button type="button" class="btn danger" id="d-del">Excluir</button></span>`:"<span></span>"}
        <span class="toolbar"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></span>
      </div>
    </form>`);
  if(ed) $("#d-del").addEventListener("click",()=>{ $("#deld-area").innerHTML=`<button type="button" class="btn danger" id="d-del2">Confirmar exclusão</button>`; $("#d-del2").addEventListener("click",async()=>{ if(await apagar("despesas",d.id)){ fecharModal(); toast("Despesa excluída"); } }); });
  $("#fd").addEventListener("submit",async e=>{
    e.preventDefault(); const v=parseFloat($("#d-valor").value);
    if(!(v>0)){ toast("Coloque o valor da despesa."); return; }
    const data={descricao:$("#d-desc").value.trim(),valor:r2(v),data:$("#d-data").value||hoje(),categoria:$("#d-cat").value,por:USER};
    if(await salvar("despesas",ed?d.id:novoId(),data)){ fecharModal(); toast("Despesa salva"); }
  });
  if(!ed) $("#d-desc").focus();
}

function formInteressado(i, forcar){
  const ed=!!i; i=i||{situacao:"aberto",data:hoje()};
  const sit=forcar||i.situacao;
  abrirModal(`<h2>${ed?"Interessado":"Novo interessado"}</h2>
    <form id="fi" class="sheet" style="padding:0;max-height:none;background:none">
      <div class="fld"><label for="i-nome">Nome</label><input id="i-nome" required value="${esc(i.nome)}"></div>
      <div class="two">
        <div class="fld"><label for="i-contato">WhatsApp ou @</label><input id="i-contato" value="${esc(i.contato)}"></div>
        <div class="fld"><label for="i-data">Quando perguntou</label><input id="i-data" type="date" value="${i.data||hoje()}"></div>
      </div>
      <div class="fld"><label for="i-camisa">Camisa que queria</label><input id="i-camisa" value="${esc(i.camisa)}" placeholder="Ex.: Seleção 2026 amarela"></div>
      <div class="fld"><label for="i-sit">Situação</label><select id="i-sit">${[["aberto","Em conversa"],["comprou","Comprou"],["desistiu","Desistiu"]].map(([k,n])=>`<option value="${k}" ${k===sit?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="fld" id="i-motivo-w" ${sit==="desistiu"?"":"hidden"}><label for="i-motivo">Por que desistiu?</label><select id="i-motivo">${Object.entries(MOTIVOS).map(([k,n])=>`<option value="${k}" ${k===i.motivo?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="fld"><label for="i-obs">Observações</label><textarea id="i-obs" rows="2" placeholder="O que a pessoa falou">${esc(i.obs)}</textarea></div>
      <div class="sheet-acts">
        ${ed?`<span id="deli-area"><button type="button" class="btn danger" id="i-del">Excluir</button></span>`:"<span></span>"}
        <span class="toolbar"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></span>
      </div>
    </form>`);
  $("#i-sit").addEventListener("change",()=>{ $("#i-motivo-w").hidden=$("#i-sit").value!=="desistiu"; });
  if(ed) $("#i-del").addEventListener("click",()=>{ $("#deli-area").innerHTML=`<button type="button" class="btn danger" id="i-del2">Confirmar exclusão</button>`; $("#i-del2").addEventListener("click",async()=>{ if(await apagar("interessados",i.id)){ fecharModal(); toast("Interessado excluído"); } }); });
  $("#fi").addEventListener("submit",async e=>{
    e.preventDefault();
    const data={...(ed?i:{}),nome:$("#i-nome").value.trim(),contato:$("#i-contato").value.trim(),data:$("#i-data").value||hoje(),camisa:$("#i-camisa").value.trim(),situacao:$("#i-sit").value,obs:$("#i-obs").value.trim()};
    delete data.id;
    if(data.situacao==="desistiu") data.motivo=$("#i-motivo").value; else delete data.motivo;
    if(await salvar("interessados",ed?i.id:novoId(),data)){ fecharModal(); toast("Salvo"); }
  });
  if(!ed) $("#i-nome").focus();
}

/* ===== Backup em Excel ===== */
function carregarXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); return new Promise((ok,err)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=()=>ok(window.XLSX); sc.onerror=()=>err(new Error("xlsx")); document.head.appendChild(sc); }); }
async function baixarBackup(btn){
  btn.disabled=true; const t=btn.textContent; btn.textContent="Gerando planilha…";
  try{
    const X=await carregarXLSX();
    const ord=S.pedidos.slice().sort((a,b)=>(a.numero||0)-(b.numero||0)||(a.dataPedido||"").localeCompare(b.dataPedido||""));
    const ped=[], pag=[];
    ord.forEach(p=>{
      const its=itensDe(p), tab=tabelaPedido(p)||1, val=valorPedido(p);
      its.forEach((it,i)=>{ const vit=val*precoItem(it)/tab;
        ped.push({"Nº":p.numero||"","Data do pedido":dBR(p.dataPedido),"Cliente":p.cliente||"","Contato":p.contato||"","Status":STATUS_NOME[p.status]||p.status,
          "Camisa":it.camisa||"","Versão":TIPOS[it.tipo]?.nome||"","Tamanho":it.tamanho||"","Qtd":it.qtd||1,
          "Adicionais":(it.extras||[]).map(e=>EXTRAS[e]?.nome).filter(Boolean).join(", "),
          "Valor cobrado (R$)":r2(vit),"Custo (R$)":r2(custoItem(it)),"Lucro bruto (R$)":r2(vit-custoItem(it)),
          "Custo do lote?":typeof it.custoUnit==="number"?"Sim":"Estimado","Desconto do pedido (R$)":i===0?r2(descontoDe(p)):"","Falta receber (R$)":i===0?faltaDe(p):"","Entrega":i===0&&p.entrega&&p.entrega.tipo?ENTREGAS[p.entrega.tipo]:"","Endereço":i===0&&p.entrega?p.entrega.endereco||"":"",
          "Encomendado em":dBR(p.dataEncomenda),"Chegou em":dBR(p.dataChegada),"Entregue em":dBR(p.dataEntrega),"Foto":it.foto||"","Observações":i===0?(p.obs||""):"" }); });
      (p.pagamentos||[]).forEach(x=>pag.push({"Nº":p.numero||"","Cliente":p.cliente||"","Data":dBR(x.data),"Valor (R$)":r2(x.valor),"Forma":FORMAS[x.forma]||""}));
    });
    const cli=listaClientes().map(c=>({"Cliente":c.nome,"Contato":c.contato,"Pedidos":c.n,"Camisas pagas":c.camisas,"Total gasto (R$)":r2(c.total),"Última compra":dBR(c.ultima),"Prêmios ganhos":c.premios,"Prêmios entregues":c.usados}));
    const desp=S.despesas.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(d=>({"Data":dBR(d.data),"Descrição":d.descricao||"","Categoria":CAT_DESP[d.categoria]||"Outro","Valor (R$)":r2(d.valor)}));
    const lot=S.lotes.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(l=>({"Data":dBR(l.data),"Peças":l.pecas,"Custo (R$)":r2(l.custo),"Vendas (R$)":r2(l.receita),"Lucro bruto (R$)":r2(l.lucro)}));
    const inte=S.interessados.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(i=>({"Data":dBR(i.data),"Nome":i.nome||"","Contato":i.contato||"","Camisa":i.camisa||"","Situação":{aberto:"Em conversa",comprou:"Comprou",desistiu:"Desistiu"}[i.situacao]||"","Motivo":i.situacao==="desistiu"?(MOTIVOS[i.motivo]||""):"","Observações":i.obs||""}));
    const wb=X.utils.book_new();
    const add=(nome,rows,vazio)=>{ const r=rows.length?rows:[{[vazio]:""}]; const ws=X.utils.json_to_sheet(r); const cols=Object.keys(r[0]); ws["!cols"]=cols.map(c=>({wch:Math.min(40,Math.max(c.length+2,...r.map(x=>String(x[c]??"").length+1)))})); X.utils.book_append_sheet(wb,ws,nome); };
    add("Pedidos",ped,"Sem pedidos"); add("Pagamentos",pag,"Sem pagamentos"); add("Clientes",cli,"Sem clientes"); add("Despesas",desp,"Sem despesas"); add("Lotes",lot,"Sem lotes"); add("Interessados",inte,"Sem interessados");
    X.writeFile(wb,`kabide10-backup-${hoje()}.xlsx`);
    toast("Backup baixado");
  }catch(e){ toast("Não deu pra gerar a planilha. Confira a internet e tente de novo."); }
  btn.disabled=false; btn.textContent=t;
}
</script>
